spec_version: 1
project:
  name: APPD-PumpSuite
  target_python: 3.14.2
  ui_framework: PySide6 (Qt 6)
  spec_file_path_contract: modules/tehl/spec/ui_spec.yaml
module:
  id: tehl
  title: 摩擦副/TEHL
ui:
  subpages:
    - id: inputs
      title: TEHL-输入与求解
    - id: pressures
      title: TEHL-压力场/接触/总压
    - id: post
      title: TEHL-膜厚/温度/收敛/导出
  tabs:
    - id: inputs
      title: 输入与求解
      groups:
        - id: solve_parameters
          title: Solve Parameters
          fields:
            - id: frame_index
              label: Frame Index
              type: int
              default: 1
              min: 1
              max: 1
              unit: "-"
              widget: { kind: slider }
            - id: revolutions
              label: Revolutions
              type: int
              default: 5
              min: 1
              max: 100
              unit: rev
              widget: { kind: spin_box }
        - id: fluid
          title: Fluid
          fields:
            - { id: density_rho, label: "Density ρ", type: float, default: 850.0, min: 100.0, max: 5000.0, unit: "kg/m³", widget: { kind: double_spin_box } }
            - { id: viscosity_mu0, label: "Viscosity μ0", type: float, default: 0.03, min: 0.000001, max: 10.0, unit: "Pa·s", widget: { kind: double_spin_box } }
            - { id: pressure_viscosity_alpha, label: "Pressure-viscosity α", type: float, default: 1.0e-8, min: 0.0, max: 1.0e-6, unit: "1/Pa", widget: { kind: sci_double_edit } }
            - { id: density_pressure_beta, label: "Density-pressure β", type: float, default: 1.5e-8, min: 0.0, max: 1.0e-6, unit: "1/Pa", widget: { kind: sci_double_edit } }
            - { id: temperature_t0, label: "Temperature T0", type: float, default: 40.0, min: -50.0, max: 300.0, unit: "°C", widget: { kind: double_spin_box } }
            - { id: speed_omega, label: "Speed ω", type: float, default: 100.0, min: 0.0, max: 100000.0, unit: "rad/s", widget: { kind: double_spin_box } }
        - id: geometry
          title: Geometry
          fields:
            - { id: ball_radius_rb, label: "Ball radius Rb", type: float, default: 0.0095, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
            - { id: outer_radius_rg, label: "Outer radius Rg", type: float, default: 0.021, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
            - { id: slipper_radius_rs, label: "Slipper radius Rs", type: float, default: 0.006, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
            - { id: swash_angle_phi, label: "Swash angle φ", type: float, default: 20.0, min: 0.0, max: 90.0, unit: "deg", widget: { kind: double_spin_box } }
            - { id: piston_angle_gamma, label: "Piston angle γ", type: float, default: 15.0, min: 0.0, max: 90.0, unit: "deg", widget: { kind: double_spin_box } }
            - { id: inner_radius_rin, label: "Inner radius rin", type: float, default: 0.0035, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
            - { id: outer_radius_rout, label: "Outer radius rout", type: float, default: 0.009, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
            - { id: number_of_pistons_np, label: "Number of pistons Np", type: int, default: 9, min: 1, max: 50, unit: "-", widget: { kind: spin_box } }
            - { id: groove_width, label: "Groove width", type: float, default: 0.1, min: 0.0, max: 10.0, unit: "ratio", widget: { kind: double_spin_box } }
            - { id: phase, label: "Phase", type: float, default: 0.0, min: -360.0, max: 360.0, unit: "deg", widget: { kind: double_spin_box } }
            - { id: thickness_t, label: "Thickness t", type: float, default: 0.0005, min: 0.0, max: 1.0, unit: "m", widget: { kind: double_spin_box } }
        - id: materials
          title: Materials
          fields:
            - { id: slipper_e, label: "Slipper E", type: float, default: 2.0e11, min: 1.0e6, max: 1.0e13, unit: "Pa", widget: { kind: sci_double_edit } }
            - { id: slipper_nu, label: "Slipper ν", type: float, default: 0.3, min: 0.0, max: 0.5, unit: "-", widget: { kind: double_spin_box } }
            - { id: swash_e, label: "Swash E", type: float, default: 2.0e11, min: 1.0e6, max: 1.0e13, unit: "Pa", widget: { kind: sci_double_edit } }
            - { id: swash_nu, label: "Swash ν", type: float, default: 0.3, min: 0.0, max: 0.5, unit: "-", widget: { kind: double_spin_box } }
            - { id: slipper_k, label: "Slipper k", type: float, default: 46.0, min: 0.0, max: 1000.0, unit: "W/m·K", widget: { kind: double_spin_box } }
            - { id: swash_k, label: "Swash k", type: float, default: 46.0, min: 0.0, max: 1000.0, unit: "W/m·K", widget: { kind: double_spin_box } }
            - { id: slipper_alpha_t, label: "Slipper αT", type: float, default: 1.2e-5, min: 0.0, max: 1.0e-3, unit: "1/K", widget: { kind: sci_double_edit } }
            - { id: swash_alpha_t, label: "Swash αT", type: float, default: 1.2e-5, min: 0.0, max: 1.0e-3, unit: "1/K", widget: { kind: sci_double_edit } }
            - { id: swash_density, label: "Swash density", type: float, default: 7800.0, min: 0.0, max: 30000.0, unit: "kg/m³", widget: { kind: double_spin_box } }
        - id: boundary
          title: Boundary
          fields:
            - { id: high_pressure_ph, label: "High pressure Ph", type: float, default: 35000000.0, min: 0.0, max: 1.0e9, unit: "Pa", widget: { kind: sci_double_edit } }
            - { id: low_pressure_pl, label: "Low pressure Pl", type: float, default: 2000000.0, min: 0.0, max: 1.0e9, unit: "Pa", widget: { kind: sci_double_edit } }
            - { id: case_pressure_pc, label: "Case pressure Pc", type: float, default: 100000.0, min: 0.0, max: 1.0e9, unit: "Pa", widget: { kind: sci_double_edit } }
            - { id: case_temperature_tc, label: "Case temperature Tc", type: float, default: 60.0, min: -50.0, max: 300.0, unit: "°C", widget: { kind: double_spin_box } }
            - { id: initial_film_thickness_h0, label: "Initial film thickness h0", type: float, default: 5.0e-6, min: 0.0, max: 1.0, unit: "m", widget: { kind: sci_double_edit } }
        - id: tehl_models
          title: TEHL Models
          fields:
            - id: pressure_model
              label: Pressure model
              type: enum
              items: [Reynolds, Poiseuille]
              default: Reynolds
              unit: "-"
              widget: { kind: combo_box }
            - id: contact_model
              label: Contact model
              type: enum
              items: [Hertzian, None, GW]
              default: Hertzian
              unit: "-"
              widget: { kind: combo_box }
            - id: cavitation_model
              label: Cavitation model
              type: enum
              items: [Half-Sommerfeld, None]
              default: Half-Sommerfeld
              unit: "-"
              widget: { kind: combo_box }
            - id: thermal_model
              label: Thermal model
              type: enum
              items: [THD, Isothermal]
              default: THD
              unit: "-"
              widget: { kind: combo_box }
        - id: tehl_parameters
          title: TEHL Parameters
          fields:
            - { id: max_iterations, label: "Max iterations", type: int, default: 300, min: 1, max: 100000, unit: "-", widget: { kind: spin_box } }
            - { id: pressure_tol, label: "Pressure tol", type: float, default: 1.0e-4, min: 0.0, max: 1.0, unit: "-", widget: { kind: sci_double_edit } }
            - { id: pressure_relax, label: "Pressure relax", type: float, default: 0.8, min: 0.0, max: 1.0, unit: "-", widget: { kind: double_spin_box } }
            - { id: film_tol, label: "Film tol", type: float, default: 1.0e-5, min: 0.0, max: 1.0, unit: "-", widget: { kind: sci_double_edit } }
            - { id: film_relax, label: "Film relax", type: float, default: 0.6, min: 0.0, max: 1.0, unit: "-", widget: { kind: double_spin_box } }
            - { id: tmax_s, label: "Tmax (s)", type: float, default: 0.2, min: 0.0, max: 100.0, unit: "s", widget: { kind: double_spin_box } }
            - { id: init_t, label: "Init T", type: float, default: 1.0, min: 0.0, max: 10000.0, unit: "-", widget: { kind: double_spin_box } }
            - { id: use_ctdma, label: "Use CTDMA", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: ramp_up, label: "Ramp up", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: clamp_pressure, label: "Clamp pressure", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: solve_contact, label: "Solve contact", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: wear_model, label: "Wear model", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: deformation, label: "Deformation", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: thermal, label: "Thermal", type: bool, default: true, unit: "-", widget: { kind: check_box } }
        - id: tilt_options
          title: Tilt Options
          fields:
            - { id: enable_tilt_x, label: "Enable tilt-x", type: bool, default: false, unit: "-", widget: { kind: check_box } }
            - { id: tilt_x, label: "tilt-x", type: float, default: 0.0, min: -1.0, max: 1.0, unit: "rad", widget: { kind: double_spin_box } }
            - { id: enable_tilt_y, label: "Enable tilt-y", type: bool, default: false, unit: "-", widget: { kind: check_box } }
            - { id: tilt_y, label: "tilt-y", type: float, default: 0.0, min: -1.0, max: 1.0, unit: "rad", widget: { kind: double_spin_box } }
    - id: pressures
      title: 压力场
      groups:
        - id: pressure_maps
          title: Pressures
          fields:
            - { id: global_film_pressure, label: "Global Film Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: global_contact_pressure, label: "Global Contact Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: global_total_pressure, label: "Global Total Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: local_film_pressure, label: "Local Film Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: local_contact_pressure, label: "Local Contact Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: local_total_pressure, label: "Local Total Pressure (Pa)", type: bool, default: true, unit: "heatmap", widget: { kind: check_box } }
            - { id: clip_global, label: "Clip Global", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: clip_local, label: "Clip Local", type: bool, default: false, unit: "-", widget: { kind: check_box } }
    - id: post
      title: 膜厚/温度/收敛/导出
      groups:
        - id: post_outputs
          title: Post Outputs
          fields:
            - { id: film_thickness_map, label: "Film thickness map", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: temperature_map, label: "Temperature map", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: convergence_plot, label: "Convergence plot", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: kpi_summary, label: "KPI summary", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: export_png, label: "Export PNG", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: export_csv, label: "Export CSV", type: bool, default: true, unit: "-", widget: { kind: check_box } }
            - { id: export_json, label: "Export JSON", type: bool, default: true, unit: "-", widget: { kind: check_box } }
outputs:
  pages:
    - id: pressures
      title: Pressures
    - id: post
      title: Post
