[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-suite"
version = "0.6.0"
description = "APPD-style modular pump desktop scaffold"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8"
]

[tool.pytest.ini_options]
testpaths = ["modules"]
