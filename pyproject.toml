[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-screener"
version = "0.1.0"
description = "China A-share stock screener with MACD multi-timeframe filters"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = {text = "MIT"}
authors = [{name = "Example Author"}]
keywords = ["A-share", "screener", "stock", "MACD"]

[project.scripts]
ashare-screener = "screener.app.cli:main"

[tool.setuptools]
packages = ["screener", "screener.app", "screener.data", "screener.indicators", "screener.filters", "screener.utils"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
